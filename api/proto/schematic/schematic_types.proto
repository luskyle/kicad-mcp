syntax = "proto3";

package kiapi.schematic.types;

import "common/types/base_types.proto";

enum SchematicLayer
{
  SL_UNKNOWN = 0;

  // Corresponds to SCH_LAYER_ID::LAYER_WIRE
  SL_WIRE = 1;

  // Corresponds to SCH_LAYER_ID::LAYER_BUS
  SL_BUS = 2;

  // Corresponds to SCH_LAYER_ID::LAYER_NOTES
  SL_NOTES = 3;
}

/// Represents a schematic line segment, which may be a wire, bus, or graphical line
message Line
{
  kiapi.common.types.KIID    id     = 1;
  kiapi.common.types.Vector2 start  = 2;
  kiapi.common.types.Vector2 end    = 3;

  /**
   * One of: LAYER_BUS, LAYER_WIRE, LAYER_NOTES
   */
  SchematicLayer layer = 4;
}

// (kicad-mcp patch) A bus entry: short diagonal segment connecting a signal
// wire (or bus) to a bus line.  `position` is the end on the signal side,
// `end` is the end on the bus side.  Maps to SCH_BUS_WIRE_ENTRY (wire->bus).
message BusEntry
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  kiapi.common.types.Vector2 end      = 3;
}

message Text
{
  // (kicad-mcp patch) ID was added so text items can be updated/deleted via
  // the API (the base kiapi.common.types.Text has no ID field).
  kiapi.common.types.KIID id = 1;

  kiapi.common.types.Text text = 2;
}

// (kicad-mcp patch) Label arrow shape (input/output/bidirectional/tri-state).
// Maps to SCH_LABEL_BASE::LABEL_FLAG_SHAPE (L_UNSPECIFIED=4, L_INPUT=0, ...).
enum LabelShape
{
  LS_UNSPECIFIED   = 0;
  LS_INPUT         = 1;
  LS_OUTPUT        = 2;
  LS_BIDIRECTIONAL = 3;
  LS_TRISTATE      = 4;
}

// (kicad-mcp patch) Label connection-point direction (text side).
// Maps to SPIN_STYLE::SPIN (LEFT=0, UP=1, RIGHT=2, BOTTOM=3).
enum LabelSpin
{
  LSPIN_LEFT  = 0;
  LSPIN_UP    = 1;
  LSPIN_RIGHT = 2;
  LSPIN_DOWN  = 3;
}

// (kicad-mcp patch) Directive (flag) label shape: point/circle/diamond/rect.
// Maps to FLAG_SHAPE (F_DOT, F_ROUND, F_DIAMOND, F_RECTANGLE).
enum DirectiveShape
{
  DS_POINT    = 0;
  DS_CIRCLE   = 1;
  DS_DIAMOND  = 2;
  DS_RECTANGLE = 3;
}

// (kicad-mcp patch) Symbol mirror state (horizontal X / vertical Y flip).
// Maps to SCH_SYMBOL SYM_MIRROR_X / SYM_MIRROR_Y.
enum SymbolMirror
{
  SM_NONE = 0;
  SM_X    = 1;   // horizontal mirror (flip across X axis)
  SM_Y    = 2;   // vertical mirror (flip across Y axis)
}

message LocalLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
  LabelShape                 shape    = 4;
  LabelSpin                  spin     = 5;
}

message GlobalLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
  LabelShape                 shape    = 4;
  LabelSpin                  spin     = 5;
}

message HierarchicalLabel
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  Text                       text     = 3;
  LabelShape                 shape    = 4;
  LabelSpin                  spin     = 5;
}

message DirectiveLabel
{
  kiapi.common.types.KIID    id             = 1;
  kiapi.common.types.Vector2 position       = 2;
  Text                       text           = 3;
  DirectiveShape             directive_shape = 4;
  LabelSpin                  spin           = 5;
}

/// A name/value pair for a schematic symbol field (e.g. "Reference", "Value")
message Field
{
  string name = 1;
  string value = 2;
}

// (kicad-mcp patch) A pin of a placed symbol, with its ABSOLUTE position as
// computed by KiCad (symbol origin + library pin offset, after rotation).
// Using these coordinates for wires guarantees the endpoints land exactly on
// the pins (KiCad's own pin positions, which can differ by 1 IU from a
// client-side recomputation) so ERC reports no unconnected pins.
message Pin
{
  string number = 1;
  string name = 2;
  kiapi.common.types.Vector2 position = 3;
}

/// Represents a schematic symbol (component instance) placed on a schematic.
/// The library symbol is resolved by lib_id when the item is created.
message Symbol
{
  kiapi.common.types.KIID id = 1;

  // Position of the symbol on the schematic, in nanometers
  kiapi.common.types.Vector2 position = 2;

  // The LIB_ID of the symbol to instantiate (e.g. nickname "Device", name "R")
  kiapi.common.types.LibraryIdentifier lib_id = 3;

  // Fields to set on the created symbol (Reference, Value, custom fields)
  repeated Field fields = 4;

  // (kicad-mcp patch) Symbol rotation/mirror state as stored by
  // SCH_SYMBOL::GetOrientation() (0/90/180/270 plus mirror flags).
  int32 orientation_degrees = 5;

  // (kicad-mcp patch) Mirror state (horizontal X / vertical Y flip).
  SymbolMirror mirror = 7;

  // (kicad-mcp patch) Absolute positions of the symbol's pins, as computed by
  // KiCad (read back via GetItems).  Clients use these for exact wire routing.
  repeated Pin pins = 6;
}

// (kicad-mcp patch) Schematic graphical shape (segment/rectangle/arc/circle/
// polyline/bezier), corresponding to SCH_SHAPE.
enum ShapeType
{
  ST_UNKNOWN = 0;
  ST_SEGMENT = 1;
  ST_RECTANGLE = 2;
  ST_ARC = 3;
  ST_CIRCLE = 4;
  ST_POLY = 5;
  ST_BEZIER = 6;
}

message Shape
{
  kiapi.common.types.KIID    id        = 1;
  // Shape origin (start point). Points in `points` are ABSOLUTE schematic
  // coordinates (KiCad stores them relative to the origin internally, but the
  // API accepts absolute positions for convenience).
  kiapi.common.types.Vector2 position  = 2;
  ShapeType                  shape_type = 3;
  repeated kiapi.common.types.Vector2 points = 4;
  bool                       filled    = 5;
  // Stroke width in nanometers
  int64                      stroke_width = 6;
  SchematicLayer             layer     = 7;
  // Full graphic geometry, reusing the board-side GraphicShape message.  When
  // present this is authoritative (position/shape_type/points are ignored).
  kiapi.common.types.GraphicShape graphic = 8;
}

/// Represents a no-connect (X) marker on an unused pin
message NoConnect
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
}

/// Represents a wire junction dot
message Junction
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
}

/// Represents a bitmap image placed on the schematic (SCH_BITMAP)
message Image
{
  kiapi.common.types.KIID    id       = 1;
  kiapi.common.types.Vector2 position = 2;
  double                     scale    = 3;
  // PNG-encoded bitmap data
  bytes                      bitmap   = 4;
}

