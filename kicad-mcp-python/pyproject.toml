[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-mcp"
version = "0.1.0"
description = "MCP server for controlling KiCad (schematic & PCB drawing) via the KiCad API server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "pynng>=0.7",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kicad-mcp = "kicad_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kicad_mcp = ["proto/**/*.py"]
